name: 更新 OPENTIX RSS Feed

on:
  schedule:
    # 週一 13:00 台灣時間 = UTC 05:00
    - cron: "0 5 * * 1"
    # 週四 13:00 台灣時間 = UTC 05:00（補跑，防止週一中斷）
    - cron: "0 5 * * 4"
  workflow_dispatch:  # 允許手動觸發，方便測試

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝依賴
        run: pip install requests beautifulsoup4

      - name: 執行爬蟲
        run: python scrape.py

      - name: 推回異動檔案
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml docs/seen_ids.json
          git diff --cached --quiet || git commit -m "chore: 更新 RSS feed $(date +'%Y-%m-%d')"
          git push